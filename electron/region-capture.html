<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
      background: transparent;
    }
    
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }
    
    #selection {
      position: absolute;
      border: 2px solid #6366f1;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      display: none;
    }
    
    #dimensions {
      position: absolute;
      background: rgba(99, 102, 241, 0.9);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transform: translateX(-50%);
      pointer-events: none;
      display: none;
    }
    
    #instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="selection"></div>
  <div id="dimensions"></div>
  <div id="instructions">Press ESC to cancel</div>
  
  <script>
    const { ipcRenderer } = require('electron');
    
    let isDragging = false;
    let startPos = { x: 0, y: 0 };
    let selection = { x: 0, y: 0, width: 0, height: 0 };
    
    const overlay = document.getElementById('overlay');
    const selectionEl = document.getElementById('selection');
    const dimensionsEl = document.getElementById('dimensions');
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ipcRenderer.invoke('region-capture:cancel');
      }
    });
    
    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startPos = { x: e.clientX, y: e.clientY };
      selection = { x: e.clientX, y: e.clientY, width: 0, height: 0 };
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      
      const width = e.clientX - startPos.x;
      const height = e.clientY - startPos.y;
      
      selection = {
        x: width > 0 ? startPos.x : e.clientX,
        y: height > 0 ? startPos.y : e.clientY,
        width: Math.abs(width),
        height: Math.abs(height),
      };
      
      selectionEl.style.display = 'block';
      selectionEl.style.left = selection.x + 'px';
      selectionEl.style.top = selection.y + 'px';
      selectionEl.style.width = selection.width + 'px';
      selectionEl.style.height = selection.height + 'px';
      
      dimensionsEl.style.display = 'block';
      dimensionsEl.textContent = `${Math.round(selection.width)} × ${Math.round(selection.height)}`;
      dimensionsEl.style.left = (selection.x + selection.width / 2) + 'px';
      dimensionsEl.style.top = (selection.y - 30) + 'px';
    });
    
    document.addEventListener('mouseup', async () => {
      if (!isDragging) return;
      isDragging = false;
      
      // Minimum selection size
      if (selection.width < 10 || selection.height < 10) {
        ipcRenderer.invoke('region-capture:cancel');
        return;
      }
      
      try {
        await ipcRenderer.invoke('region-capture:capture', selection.x, selection.y, selection.width, selection.height);
      } catch (error) {
        console.error('Failed to capture region:', error);
        ipcRenderer.invoke('region-capture:cancel');
      }
    });
  </script>
</body>
</html>
